name: Prototype checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Core, geography and LAN tests
        run: npm test
      - name: Type check and production build
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        run: npm run test:e2e
      - name: Upload build and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rouge-world-mercator
          path: |
            dist/
            artifacts/
            test-results/
            package-lock.json
            src/generated/world.json
            docs/WORLD_MAP.md
