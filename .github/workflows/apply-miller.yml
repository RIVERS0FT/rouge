name: Integrate and verify Miller projection
on:
  push:
    branches: [feat/world-miller]
    paths: ['.changes/miller-update.b64', '.github/workflows/apply-miller.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify baseline and apply source edits
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import zlib from 'node:zlib';
          const packed=Buffer.from(fs.readFileSync('.changes/miller-update.b64','utf8'),'base64');
          if(crypto.createHash('sha256').update(packed).digest('hex')!=='7af35b96bc76dd5255418adf4ca714513ef30b9aa5007fc0df3e524204917638')throw new Error('Source update checksum mismatch');
          const edits=JSON.parse(zlib.brotliDecompressSync(packed));
          const blob=b=>crypto.createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');
          for(const e of edits){
            if(e.path.startsWith('/')||e.path.split('/').includes('..')||e.path.startsWith('.git'))throw new Error('Unsafe path');
            const old=fs.existsSync(e.path)?fs.readFileSync(e.path):null;
            if((old?blob(old):null)!==e.base)throw new Error(`Baseline differs: ${e.path}`);
          }
          for(const e of edits){
            if(e.delete){fs.unlinkSync(e.path);continue;}
            fs.mkdirSync(e.path.split('/').slice(0,-1).join('/')||'.',{recursive:true});
            if(e.content!==undefined){fs.writeFileSync(e.path,e.content);continue;}
            const lines=fs.readFileSync(e.path,'utf8').match(/[^\n]*\n|[^\n]+$/g)||[];
            for(const [start,end,text]of [...e.edits].reverse())lines.splice(start,end-start,text);
            fs.writeFileSync(e.path,lines.join(''));
          }
          NODE
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Core, projection, compatibility and LAN tests
        run: npm test
      - name: Type check and production build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Actual browser acceptance and screenshots
        run: npm run test:e2e
      - name: Commit verified implementation and geographic source metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs package.json package-lock.json scripts server src tests
          git add -f src/generated/world.json
          git commit -m 'feat: use Miller cylindrical world coordinates with isolated saves and LAN compatibility'
          git push origin HEAD:feat/world-miller
      - name: Export build and real screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rouge-miller-integration
          path: |
            dist/
            artifacts/
            test-results/
            src/generated/world.json
            docs/WORLD_MAP.md
