name: Verify deployed ROUGE
on:
  workflow_run:
    workflows: [Publish ROUGE to GitHub Pages]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
# Deduplicate only the same deployment. Old completed events cannot cancel newer
# acceptance before provenance/freshness checks. New deployments explicitly
# cancel older acceptance runs in pages.yml, without holding the deployment lock.
concurrency:
  group: rouge-acceptance-${{ github.event.workflow_run.id }}
  cancel-in-progress: true
jobs:
  source:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      page_url: ${{ steps.source.outputs.page_url }}
    steps:
      - name: Checkout trusted acceptance policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Authorize successful publication
        id: publication
        uses: actions/github-script@v7
        with:
          script: |
            const {publishedRun} = require('./.github/scripts/pages-acceptance.cjs');
            const publication = await publishedRun({github, context});
            core.setOutput('artifact', publication?.artifact || '');
            core.setOutput('publication', JSON.stringify(publication));
            if (!publication) core.notice('No authorized deployment to verify.');
      - name: Read this deployment manifest
        if: steps.publication.outputs.artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.publication.outputs.artifact }}
          path: deployed-source
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Select exact deployed main SHA
        if: steps.publication.outputs.artifact != ''
        id: source
        uses: actions/github-script@v7
        env:
          PUBLICATION: ${{ steps.publication.outputs.publication }}
        with:
          script: |
            const fs = require('node:fs');
            const {selectAcceptance} = require('./.github/scripts/pages-acceptance.cjs');
            const source = await selectAcceptance({github, context,
              publication: JSON.parse(process.env.PUBLICATION),
              manifest: JSON.parse(fs.readFileSync('deployed-source/deployment.json', 'utf8'))});
            core.setOutput('sha', source?.sha || '');
            core.setOutput('page_url', source?.url || '');
            if (!source) core.notice('A newer main commit superseded this deployment.');
  checks:
    needs: source
    if: needs.source.outputs.sha != ''
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.source.outputs.sha }}
  verify:
    needs: [source, checks]
    # Genuine test failures still collect live evidence; cancelled/superseded
    # acceptance must not restart itself or delay a newer deployment.
    if: always() && !cancelled() && needs.source.outputs.sha != '' && needs.checks.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout trusted verification script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-ops
          persist-credentials: false
      - name: Recheck acceptance freshness
        id: current
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        with:
          script: |
            const {isCurrentMain} = require('./release-ops/.github/scripts/pages-source.cjs');
            const current = await isCurrentMain({github, context, sha: process.env.SOURCE_SHA});
            core.setOutput('current', String(current));
            if (!current) core.notice('Skip superseded live verification.');
      - name: Checkout exact published game source
        if: steps.current.outputs.current == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          path: game
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.current.outputs.current == 'true'
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci --no-audit --no-fund
        if: steps.current.outputs.current == 'true'
        working-directory: game
      - run: npm run prepare:map
        if: steps.current.outputs.current == 'true'
        working-directory: game
      - run: npx playwright install --with-deps chromium
        if: steps.current.outputs.current == 'true'
        working-directory: game
      - name: Verify live HTTPS game, regions, remote orders and browser saves
        if: steps.current.outputs.current == 'true'
        env:
          SITE_URL: ${{ needs.source.outputs.page_url }}
          SOURCE_COMMIT: ${{ needs.source.outputs.sha }}
        run: node release-ops/.github/scripts/verify-pages.mjs
      - name: Archive live-site verification evidence
        if: always() && steps.current.outputs.current == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pages-live-verification-${{ needs.source.outputs.sha }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 30
