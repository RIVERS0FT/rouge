name: Integrate and verify Miller crop
on:
  push:
    branches: [feat/world-miller-crop]
    paths: ['.changes/**', '.github/workflows/apply-crop.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify source and apply crop implementation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import zlib from 'node:zlib';
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const compressed=Buffer.from([1,2,3,4].map(i=>fs.readFileSync(`.changes/crop-${i}.b64`,'utf8')).join(''),'base64');
          if(hash(compressed)!=='93f6bbb95b23fc364f605566d41579ac2659f5a96fe7f96eb48b1e0500ce3936')throw Error('Invalid patch checksum');
          const edits=JSON.parse(zlib.brotliDecompressSync(compressed).toString());
          const pending=[];
          for(const edit of edits){
            if(edit.path.startsWith('/')||edit.path.split('/').includes('..')||edit.path.startsWith('.git'))throw Error('Unsafe path');
            const old=fs.existsSync(edit.path)?fs.readFileSync(edit.path):null;
            if((old?hash(old):null)!==edit.base)throw Error(`Changed source: ${edit.path}`);
            const lines=(old?old.toString():'').match(/[^\n]*\n|[^\n]+$/g)||[];
            for(const [a,b,text] of [...edit.edits].reverse())lines.splice(a,b-a,text);
            const output=lines.join('');if(hash(output)!==edit.result)throw Error(`Output mismatch: ${edit.path}`);
            pending.push([edit.path,output]);
          }
          for(const [path,text] of pending){fs.mkdirSync(path.split('/').slice(0,-1).join('/')||'.',{recursive:true});fs.writeFileSync(path,text);}
          NODE
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Core and crop regression tests
        run: npm test
      - name: Type check and production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance and real screenshots
        run: npm run test:e2e
      - name: Commit verified implementation
        run: |
          rm -f .changes/crop-*.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: crop Miller world to 74N with shared gameplay mask and wrapping atlas'
          git push origin HEAD:feat/world-miller-crop
      - name: Archive tested source
        if: always()
        run: tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=artifacts --exclude=test-results --exclude=.cache -czf /tmp/rouge-world-miller-crop-source.tar.gz . && mkdir -p artifacts && cp /tmp/rouge-world-miller-crop-source.tar.gz artifacts/
      - name: Upload build and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rouge-crop-integration
          path: |
            dist/
            artifacts/
            test-results/
            docs/MAP_CROP.md
