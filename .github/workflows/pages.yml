name: Publish ROUGE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Resolve and authorize exact main commit
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const {selectSource} = require('./.github/scripts/pages-source.cjs');
            const sha = await selectSource({github, context});
            core.setOutput('sha', sha || '');
            if (!sha) core.notice('Skipping non-PR, untrusted or superseded source.');
  build:
    needs: source
    if: needs.source.outputs.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/configure-pages@v5
        id: pages
      - name: Checkout exact game source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Record exact game commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check and build for the Pages subpath
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run build -- --base "$SITE_BASE"
      - name: Add build identity and accurate source notices
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          touch dist/.nojekyll
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const atlas = JSON.parse(fs.readFileSync('src/generated/world.json', 'utf8'));
          const isRegions = fs.existsSync('docs/STATE_REGIONS.md');
          fs.writeFileSync('dist/build-info.json', JSON.stringify({
            name:'ROUGE', version:pkg.version, sourceCommit:process.env.SOURCE_COMMIT,
            hosting:'GitHub Pages', multiplayerBackendIncluded:false,
            map:isRegions?'earth-state-regions-1137-v1':'earth-admin1-miller-crop-v1',
            regionCount:atlas.provinces.length,
            mapRedistributionAuthorization:isRegions?'not-verified':'natural-earth-public-domain'
          }, null, 2));
          const notices = ['ROUGE - bundled library notices\n'];
          for (const name of ['react','react-dom','scheduler','three']) {
            notices.push(`\n===== ${name} =====\n`, fs.readFileSync(`node_modules/${name}/LICENSE`,'utf8'));
          }
          if (isRegions) {
            notices.push('\nMAP DATA: transformed Victoria 3 1.13.7 State Region reference boundaries.\nIndependent redistribution authorization has not been verified.\nThese boundaries are NOT Natural Earth public-domain data and are NOT covered by the map editor tool MIT license.\nSee MAP_DATA_SOURCE.md for the pinned source and limitations.\n');
            fs.copyFileSync('docs/STATE_REGIONS.md','dist/MAP_DATA_SOURCE.md');
            fs.copyFileSync('data/state-regions-audit.json','dist/map-data-audit.json');
          } else {
            notices.push('\nMap data: Natural Earth, public domain. https://www.naturalearthdata.com/about/terms-of-use/\n');
          }
          fs.writeFileSync('dist/THIRD_PARTY_NOTICES.txt',notices.join('\n'));
          NODE
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      deployed: ${{ steps.current.outputs.current == 'true' && steps.deployment.outcome == 'success' }}
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Recheck main immediately before deployment
        id: current
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        with:
          script: |
            const {isCurrentMain} = require('./.github/scripts/pages-source.cjs');
            const current = await isCurrentMain({github, context, sha: process.env.SOURCE_SHA});
            core.setOutput('current', String(current));
            if (!current) core.notice('main advanced during build; skip stale deployment.');
      - name: Publish website
        if: steps.current.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
  checks:
    needs: [build, deploy]
    if: needs.deploy.outputs.deployed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.build.outputs.source_sha }}
  verify:
    needs: [build, deploy, checks]
    # Test failures must not skip live evidence or roll back the published game.
    if: always() && needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout trusted verification script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-ops
          persist-credentials: false
      - name: Checkout exact published game source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          path: game
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: game
      - run: npm run prepare:map
        working-directory: game
      - run: npx playwright install --with-deps chromium
        working-directory: game
      - name: Verify live HTTPS game, regions, remote orders and browser saves
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_sha }}
        run: node release-ops/.github/scripts/verify-pages.mjs
      - name: Archive live-site verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-live-verification
          path: artifacts/
          retention-days: 30
