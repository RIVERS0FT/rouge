name: Integrate commander identity HUD
on:
  push:
    branches: [feat/commander-hud]
    paths: [.changes/hud.b64, .github/workflows/apply-hud.yml, tests/lan.test.mjs]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify baseline and apply HUD changes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import zlib from 'node:zlib';
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const archive=Buffer.from(fs.readFileSync('.changes/hud.b64','utf8'),'base64');
          if(hash(archive)!=='198ec75793be39f3aa1abe592a1b1daf44d45b63d0556cfd817eef8a32397c23')throw Error('Patch checksum mismatch');
          const edits=JSON.parse(zlib.brotliDecompressSync(archive));
          const results=[];
          for(const edit of edits){
            if(edit.path.startsWith('/')||edit.path.split('/').includes('..')||edit.path.startsWith('.git'))throw Error('Unsafe path');
            const old=fs.existsSync(edit.path)?fs.readFileSync(edit.path):null;
            if((old?hash(old):null)!==edit.base)throw Error(`Baseline mismatch: ${edit.path}`);
            const lines=old?(old.toString().match(/[^\n]*\n|[^\n]+$/g)||[]):[];
            for(const[start,end,text]of [...edit.edits].reverse())lines.splice(start,end-start,text);
            const result=lines.join('');
            if(hash(result)!==edit.result)throw Error(`Result mismatch: ${edit.path}`);
            results.push([edit.path,result]);
          }
          for(const[path,content]of results){fs.mkdirSync(path.split('/').slice(0,-1).join('/')||'.',{recursive:true});fs.writeFileSync(path,content);}
          NODE
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Core and identity regression tests
        run: npm test
      - name: Type check and production build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance and actual screenshots
        run: npm run test:e2e
      - name: Commit verified implementation
        run: |
          rm .changes/hud.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add local country flag and leader half-body portrait to game HUD'
          git push origin HEAD:feat/commander-hud
      - name: Archive tested source
        if: always()
        run: tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=artifacts --exclude=test-results --exclude=.cache --exclude=.changes -czf /tmp/rouge-commander-hud-source.tar.gz . && mkdir -p artifacts && cp /tmp/rouge-commander-hud-source.tar.gz artifacts/
      - name: Export build and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rouge-commander-hud-integration
          path: |
            dist/
            artifacts/
            test-results/
