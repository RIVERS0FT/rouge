name: World map data preparation
on:
  push:
    branches: [feat/world-mercator]
    paths: [.github/workflows/world-data.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --no-audit --no-fund
      - name: Fetch immutable Natural Earth source
        run: |
          mkdir -p world-preparation
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/f1890d9f152c896d250a77557a5751a93d494776/geojson/ne_10m_admin_1_states_provinces.geojson' -o world-preparation/admin1.geojson
          sha256sum world-preparation/admin1.geojson > world-preparation/source.sha256
          cp package-lock.json world-preparation/
          tar -czf world-preparation/toolchain.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: world-preparation
          path: world-preparation/
          retention-days: 7
