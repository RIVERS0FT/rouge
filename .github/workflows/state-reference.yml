name: Prepare management-region atlas
on:
  push:
    branches: [feat/state-regions-routing]
    paths: ['scripts/prepare-state-reference.py', '.github/workflows/state-reference.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 pillow==11.3.0 rasterio==1.4.3 shapely==2.1.2
      - run: python scripts/prepare-state-reference.py
      - uses: actions/upload-artifact@v4
        with:
          name: management-region-atlas
          path: artifacts/state-reference/
          retention-days: 30
