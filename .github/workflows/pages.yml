name: Publish ROUGE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Resolve and authorize exact main commit
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const {selectSource} = require('./.github/scripts/pages-source.cjs');
            const sha = await selectSource({github, context});
            core.setOutput('sha', sha || '');
            if (!sha) core.notice('Skipping non-PR, untrusted or superseded source.');
      - name: Cancel superseded acceptance only
        if: steps.source.outputs.sha != ''
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const {cancelSupersededAcceptance} = require('./.github/scripts/pages-acceptance.cjs');
            try {
              const ids = await cancelSupersededAcceptance({github, context, sha: process.env.SOURCE_SHA});
              core.notice(`Requested cancellation of older acceptance runs: ${ids.join(', ') || 'none'}`);
            } catch (error) {
              // Cancellation is best effort and must never become a deployment gate.
              core.warning(`Could not cancel older acceptance: ${error.message}`);
            }
  build:
    needs: source
    if: needs.source.outputs.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/configure-pages@v5
        id: pages
      - name: Checkout exact game source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Record exact game commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check and build for the Pages subpath
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run build -- --base "$SITE_BASE"
      - name: Add build identity and accurate source notices
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          touch dist/.nojekyll
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const atlas = JSON.parse(fs.readFileSync('src/generated/gameplay-map.json', 'utf8'));
          fs.writeFileSync('dist/build-info.json', JSON.stringify({
            name:'ROUGE', version:pkg.version, sourceCommit:process.env.SOURCE_COMMIT,
            hosting:'GitHub Pages', multiplayerBackendIncluded:false,
            map:atlas.mapId,
            regionCount:atlas.provinces.length,
            sourceAtomCount:atlas.sourceAtomCount,
            mapRedistributionAuthorization:'natural-earth-public-domain'
          }, null, 2));
          const notices = ['ROUGE - bundled library notices\n'];
          for (const name of ['react','react-dom','scheduler','three']) {
            notices.push(`\n===== ${name} =====\n`, fs.readFileSync(`node_modules/${name}/LICENSE`,'utf8'));
          }
          notices.push('\nMap geometry: Natural Earth 5.1.1 1:10m Admin1, public domain. https://www.naturalearthdata.com/about/terms-of-use/\nManagement groups are approximate references, not exact Victoria 3 boundaries.\n');
          fs.copyFileSync('docs/ADMIN1_OVERLAY_AUDIT.md','dist/MAP_DATA_SOURCE.md');
          fs.copyFileSync('data/natural-earth-admin1-base-audit.json','dist/map-data-audit.json');
          fs.writeFileSync('dist/THIRD_PARTY_NOTICES.txt',notices.join('\n'));
          NODE
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    # Serialize publication, not post-deployment acceptance or unrelated builds.
    concurrency:
      group: github-pages
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      deployed: ${{ steps.current.outputs.current == 'true' && steps.deployment.outcome == 'success' }}
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Recheck main immediately before deployment
        id: current
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        with:
          script: |
            const {isCurrentMain} = require('./.github/scripts/pages-source.cjs');
            const current = await isCurrentMain({github, context, sha: process.env.SOURCE_SHA});
            core.setOutput('current', String(current));
            if (!current) core.notice('main advanced during build; skip stale deployment.');
      - name: Publish website
        if: steps.current.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployed source
        if: steps.deployment.outcome == 'success'
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p deployed-source
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('deployed-source/deployment.json', JSON.stringify({
            version: 1, sourceCommit: process.env.SOURCE_SHA,
            pageUrl: process.env.PAGE_URL.replace(/\/?$/, '/'),
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT)
          }, null, 2));
          NODE
      - name: Publish deployment manifest
        if: steps.deployment.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: deployed-source-${{ github.run_attempt }}
          path: deployed-source/deployment.json
          if-no-files-found: error
          retention-days: 30
