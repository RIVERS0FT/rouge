name: Prioritize latest ROUGE deployment
on:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  actions: write
concurrency:
  group: rouge-deployment-priority
  cancel-in-progress: true
jobs:
  retire-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout trusted priority policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Retire old acceptance without blocking publication
        uses: actions/github-script@v7
        with:
          script: |
            const {selectSource} = require('./.github/scripts/pages-source.cjs');
            const {retireSupersededAcceptance} = require('./.github/scripts/pages-acceptance.cjs');
            const sha = await selectSource({github, context});
            if (!sha) return core.notice('Skip superseded or unauthorized publication request.');
            try {
              const ids = await retireSupersededAcceptance({github, context, sha});
              core.notice(`Retired older acceptance runs: ${ids.join(', ') || 'none'}`);
            } catch (error) {
              core.warning(`Could not retire older acceptance: ${error.message}`);
            }
